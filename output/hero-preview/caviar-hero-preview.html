   <div class="cos-copy">
    <h1 class="cos-headline" id="cos-hero-heading"><span>The Swiss art of</span><span>caviar skincare</span></h1>
    <p class="cos-description">Four Swiss-made formulas for cleansing, targeted care and daily hydration.</p>
    <div class="cos-actions">
     <button class="cos-primary cursor-interaction" type="button" data-cos-panel="collection">Shop the collection<i data-lucide="arrow-right" aria-hidden="true"></i></button>
     <button class="cos-secondary cursor-interaction" type="button" data-cos-panel="ritual">Explore the ritual</button>
    </div>
   </div>
  </section>
  <aside class="cos-panel" role="dialog" aria-labelledby="cos-panel-heading" hidden>
   <button class="cos-panel-close cursor-interaction" aria-label="Close panel" type="button"><i data-lucide="x" aria-hidden="true"></i></button>
   <h2 class="cos-panel-title" id="cos-panel-heading">The collection</h2>
   <div class="cos-panel-content"></div>
  </aside>
 </div>
</div>
<script>
(() => {
 const root = document.getElementById('caviar-hero-preview');
 const frame = root.querySelector('.cos-window');
 const panel = root.querySelector('.cos-panel');
 const title = root.querySelector('.cos-panel-title');
 const body = root.querySelector('.cos-panel-content');
 const close = root.querySelector('.cos-panel-close');
 let opener = null;
 const formulas = [
  ['All-in-One Cleanser','150 ml','A no-rinse beginning to your daily care.'],
  ['Advanced Repair Serum','30 ml','Targeted care for firmer, smoother-looking skin.'],
  ['Revitalizing Eye Cream','15 ml','Focused care for the delicate eye area.'],
  ['24h Regeneration Cream','50 ml','Daily hydration for morning and evening.']
 ];
 const list = (items) => '<ul class="cos-panel-list">' + items.map(x => '<li><strong>'+x[0]+'</strong><p>'+x[1]+'</p></li>').join('') + '</ul>';
 const content = {
  collection:['The collection',list(formulas.map(x => [x[0],x[1]+' · '+x[2]]))],
  ritual:['Four formulas, one ritual',list(formulas.map(x => [x[0],x[2]]))],
  caviar:['Caviar in every formula','<p class="cos-panel-text">Caviar extract is the signature ingredient across all four formulas. French-farmed caviar meets Swiss laboratory expertise.</p>'],
  science:['Inside the formulas','<p class="cos-panel-text">Caviar extract, hyaluronic acid, peptides and antioxidants have distinct roles in the three care formulas. The cleanser has its own formulation.</p>'],
  story:['Made in Switzerland','<p class="cos-panel-text">A focused Swiss skincare collection, with four formulas designed around daily cleansing, targeted care and hydration.</p>'],
  care:['Customer care','<p class="cos-panel-text">Complimentary worldwide delivery and 30-day returns.</p><p class="cos-panel-text">Import duties may apply. Return postage is customer-paid except for faulty or incorrect orders.</p>'],
  bag:['Your bag is empty','<p class="cos-panel-text">Discover the four formulas in the Caviar of Switzerland collection.</p><button class="cos-primary cursor-interaction" data-cos-panel="collection" type="button">Explore the collection</button>'],
  menu:['Caviar of Switzerland','<ul class="cos-panel-list">'+[['Shop','collection'],['The ritual','ritual'],['Why caviar','caviar'],['Swiss science','science'],['Our story','story']].map(x=>'<li><button class="cursor-interaction" data-cos-panel="'+x[1]+'" type="button"><strong>'+x[0]+'</strong></button></li>').join('')+'</ul>']
 };
 const hide = () => {panel.hidden=true;if(opener)opener.focus();};
 root.addEventListener('click', event => {
  const trigger=event.target.closest('[data-cos-panel]');
  if(!trigger)return;
  event.preventDefault();
  const item=content[trigger.dataset.cosPanel];
  if(!item)return;
  opener=trigger;title.textContent=item[0];body.innerHTML=item[1];panel.hidden=false;close.focus();
 });
 close.addEventListener('click',hide);
 root.addEventListener('keydown',event=>{if(event.key==='Escape')hide();});
 const state={view:'Responsive',headline:'The Swiss art of caviar skincare'};
 const render=()=>{
  frame.style.width=state.view==='Phone'?'390px':'100%';
  const heading=root.querySelector('.cos-headline');
  const variants={
   'The Swiss art of caviar skincare':'<span>The Swiss art of</span><span>caviar skincare</span>',
   'Caviar, in every formula':'<span>Caviar, in</span><span>every formula</span>',
   'The Swiss caviar ritual':'<span>The Swiss</span><span>caviar ritual</span>'
  };
  heading.innerHTML=variants[state.headline];
 };
 render();
 if(globalThis.Tweak){
  const tweak=new Tweak({container:frame,onChange:render});
  tweak.addSelect(state,'view',{label:'Preview size',options:['Responsive','Phone']});
  tweak.addSelect(state,'headline',{label:'Headline',options:['The Swiss art of caviar skincare','Caviar, in every formula','The Swiss caviar ritual']});
 }
})();
</script>
